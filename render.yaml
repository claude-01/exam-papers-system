services:
  - type: web
    name: exam-papers-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: exam-papers-db
          property: connectionString
      - key: JWT_SECRET
        value: your_jwt_secret_key_here_change_in_production_2024
    healthCheckPath: /api/status

databases:
  - name: exam-papers-db
    databaseName: exam_system
    user: exam_user
    plan: free
