services:
  # Production API Server
  - type: web
    name: exam-papers-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/papers

  # Frontend Static Site
  - type: web
    name: exam-papers-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm run build
    staticPublishPath: ./frontend/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://exam-papers-api.onrender.com/api/*
    envVars:
      - key: NODE_ENV
        value: production
